name: Camera Deck checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements.txt pytest pyinstaller
      - run: python -m pytest tests -q
      - run: python scripts/collect_licenses.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name CameraDeck --add-data 'update-public.pem;.' --add-data '../third_party_licenses;third_party_licenses' --add-data '../THIRD_PARTY_NOTICES.md;.' main.py
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: CameraDeck-Windows-CI
          path: desktop/dist/CameraDeck.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: CameraDeck-Android-CI-NOT-RELEASE-SIGNING
          path: android/app/build/outputs/apk/debug/app-debug.apk
