plugins { id 'com.android.application' }
def releaseVersion = new groovy.json.JsonSlurper().parse(file('../../version.json'))
def clientBuild = providers.gradleProperty('cameraDeckClient').orNull == 'true'
def previewBuild = providers.gradleProperty('cameraDeckPreview').orNull == 'true'
android {
    namespace 'io.github.prostoodin1.cameradeck'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.prostoodin1.cameradeck'
        minSdk 28
        targetSdk 35
        versionCode releaseVersion.code
        versionName releaseVersion.version
        buildConfigField 'int', 'PROTOCOL_VERSION', '1'
        buildConfigField 'boolean', 'PREVIEW_BUILD', 'false'
        buildConfigField 'boolean', 'CLIENT_CHANNEL', 'false'
        manifestPlaceholders = [appLabel: 'Camera Deck']
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('CAMERA_DECK_KEYSTORE')) {
                storeFile file(System.getenv('CAMERA_DECK_KEYSTORE'))
                storePassword System.getenv('CAMERA_DECK_STORE_PASSWORD')
                keyAlias System.getenv('CAMERA_DECK_KEY_ALIAS') ?: 'camera-deck'
                keyPassword System.getenv('CAMERA_DECK_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (clientBuild || previewBuild) {
                applicationIdSuffix clientBuild ? '.aurora.dev' : '.aurora'
                versionNameSuffix '-slate-preview'
                buildConfigField 'boolean', 'PREVIEW_BUILD', 'true'
                buildConfigField 'boolean', 'CLIENT_CHANNEL', clientBuild ? 'true' : 'false'
                manifestPlaceholders = [appLabel: clientBuild ? 'Camera Deck Dev' : 'Camera Deck Slate']
            }
        }
        release {
            signingConfig signingConfigs.release; minifyEnabled false
            if(clientBuild){applicationIdSuffix '.aurora';buildConfigField 'boolean','PREVIEW_BUILD','true';buildConfigField 'boolean','CLIENT_CHANNEL','true';manifestPlaceholders=[appLabel:'Camera Deck']}
        }
    }
}
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'androidx.media3:media3-transformer:1.8.1'
    implementation 'androidx.media3:media3-effect:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
